<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial</title>
    <style>
        :root {
            --amarelo-principal: #D6A24C;
            --amarelo-hover: #A5753F;
            --fundo-gradiente: linear-gradient(to bottom, #FDF6EC, #FCE9D4);
            --fundo-claro: #FFF8F1;
            --marrom: #5C4B2D;
            --marrom-claro: #4f422f;
            --bege-link: #4f472f;
            --hover-link: #d1b25d;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: var(--fundo-gradiente);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--marrom);
        }

        header {
            background-color: var(--amarelo-principal);
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        header a:hover {
            text-decoration: underline;
            opacity: 0.9;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        footer {
            background-color: var(--fundo-claro);
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: var(--marrom);
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
        }

        footer a {
            color: var(--bege-link);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: var(--hover-link);
            text-decoration: underline;
        }

        .welcome-box {
            background-color: var(--fundo-claro);
            padding: 40px 35px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            color: var(--marrom-claro);
            max-width: 600px;
            text-align: center;
        }

        .welcome-box h1 {
            margin-bottom: 20px;
            color: var(--marrom);
        }

        .welcome-box p {
            font-size: 18px;
        }
        .welcome-image {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            margin-bottom: 5px;
}
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.modal-content {
    background-color: var(--fundo-claro);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    text-align: center;
    max-width: 400px;
    width: 90%;
}

.modal h3 {
    color: var(--marrom);
    margin-bottom: 20px;
}

.modal-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.modal-buttons button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: background-color 0.3s ease;
}

.modal-buttons button:first-child {
    background-color: var(--amarelo-principal);
    color: white;
}

.modal-buttons button:first-child:hover {
    background-color: var(--amarelo-hover);
}

.modal-buttons button:last-child {
    background-color: #f0f0f0;
    color: var(--marrom);
}

.modal-buttons button:last-child:hover {
    background-color: #e0e0e0;
}

    </style>
</head>
<body>
  <header>
    <a href="cadastro.php" id="linkCadastro">Cadastro</a>
    <a href="login.php" id="linkLogin">Login</a>
    <a href="user.php" id="linkUser">Usuários</a>
    <a href="logout.php" class="header-link" id="linkLogout" onclick="openLogoutModal(event)">Sair</a>
</header>


    <main>
        <div class="welcome-box">
            <img src="/CadCoroinha/img/imagem.png" class="welcome-image">
            <h1>Igreja Seminário</h1>
            <p>Controle de missas, acólitos e coroinhas.</p>
        </div>
    </main>
<div id="logoutModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3>Tem certeza que deseja sair?</h3>
        <div class="modal-buttons">
            <button onclick="confirmLogout()">Sim, sair</button>
            <button onclick="closeModal()">Cancelar</button>
        </div>
    </div>
</div>
<script>
    function openLogoutModal(event) {
        event.preventDefault(); 
        document.getElementById('logoutModal').style.display = 'flex';
    }
    function confirmLogout() {
        window.location.href = 'logout.php';
    }
    function closeModal() {
        document.getElementById('logoutModal').style.display = 'none';
    }
</script>
<script>
    fetch('status.php')
        .then(response => response.text())
        .then(status => {
            if (status === 'logado') {
                document.getElementById('linkCadastro')?.remove();
                document.getElementById('linkLogin')?.remove();
            } else {

                document.getElementById('linkUser')?.remove();
                document.getElementById('linkLogout')?.remove();
            }
        });
</script>

    <footer>
        <div class="footer-links">
            <a href="admin.php">Coordenação</a>
        <a href="logout.php" class="header-link" onclick="openLogoutModal(event)">Sair</a>
    </footer>
</body>
</html>
